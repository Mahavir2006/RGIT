[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-sentinel"
version = "0.1.0"
description = "Urban Sentinel multi-agent intelligence layer for incident fusion and cascading-risk analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "langgraph>=0.2.45",
  "langchain-core>=0.3.0",
  "httpx>=0.27.0",
  "neo4j>=5.26.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
urban-sentinel = "urban_sentinel.api.main:run"
urban-sentinel-demo = "urban_sentinel.demo.monsoon:main"

[tool.setuptools.packages.find]
include = ["urban_sentinel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
